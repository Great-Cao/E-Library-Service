spring:
  application:
    name: e-library-service
  web:
    # Pin the locale so validation messages are deterministic English API output
    # instead of following whatever locale the host JVM happens to use.
    locale: en
    locale-resolver: fixed
  datasource:
    # SQLite is a single-file database. Foreign keys are off by default and must be
    # enabled per connection; busy_timeout makes concurrent writers wait instead of
    # failing immediately with SQLITE_BUSY.
    url: jdbc:sqlite:data/library.db?foreign_keys=true&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      pool-name: elibrary-pool
      # SQLite allows a single writer. Serializing access keeps writes free of
      # SQLITE_BUSY lock contention and is an accepted trade-off for this demo.
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # The schema is owned by Flyway and never generated by Hibernate.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

server:
  port: 8080

spring.jackson:
  serialization:
    # Timestamps are rendered as ISO-8601 UTC strings, not numeric epochs.
    write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
