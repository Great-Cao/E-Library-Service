spring:
  datasource:
    # A dedicated test database file; the dev database in data/ is never touched.
    url: jdbc:sqlite:target/test-db/e-library-test.db?foreign_keys=true&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      pool-name: elibrary-test-pool
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: warn
