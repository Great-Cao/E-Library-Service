spring:
  datasource:
    # Fallback only. AbstractIntegrationTest overrides this with a per-JVM file under
    # target/, so parallel test runs never share (or delete) the same database file.
    url: jdbc:sqlite:target/e-library-it.db?foreign_keys=true&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      pool-name: elibrary-test-pool
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
